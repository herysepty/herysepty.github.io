<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Scanner</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icon -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-card {
      background-color: #ffffffdd;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

  <div class="container scanner-card fade-in text-center">
    <h2 class="mb-4 text-primary"><i class="bi bi-qr-code-scan me-2"></i>QR Code Scanner</h2>
    <div id="reader" class="border rounded shadow mb-3"></div>
    <div class="alert alert-success d-none" id="scan-result">
      <i class="bi bi-check-circle-fill me-2"></i> Hasil Scan: <strong id="result-text"></strong>
    </div>
    <button class="btn btn-outline-primary mt-3" onclick="restartScanner()">
      <i class="bi bi-arrow-repeat me-1"></i>Scan Ulang
    </button>
  </div>

  <script>
    let html5QrcodeScanner;

    function onScanSuccess(decodedText, decodedResult) {
      const resultBox = document.getElementById("scan-result");
      const resultText = document.getElementById("result-text");

      resultText.textContent = decodedText;
      resultBox.classList.remove("d-none");

      // Stop scanning
      html5QrcodeScanner.clear().catch(error => {
        console.error("Clear error:", error);
      });
    }

    function onScanFailure(error) {
      // Optional: handle silently
    }

    function startScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 }, false
      );
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function restartScanner() {
      document.getElementById("scan-result").classList.add("d-none");
      startScanner();
    }

    // Start on load
    startScanner();
  </script>

</body>
</html>
