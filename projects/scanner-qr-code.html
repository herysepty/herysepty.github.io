<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Scanner</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-card {
      background-color: #ffffffdd;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 500px;
      width: 100%;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

<div class="container scanner-card fade-in text-center">
  <h2 class="mb-4 text-primary"><i class="bi bi-qr-code-scan me-2"></i>QR Code Scanner</h2>
  
  <div id="reader" class="border rounded shadow mb-3"></div>

  <div class="alert alert-success d-none" id="scan-result">
    <i class="bi bi-check-circle-fill me-2"></i> Hasil Scan: <strong id="result-text"></strong>
  </div>

  <div class="d-flex justify-content-center gap-2 mt-3">
    <button class="btn btn-outline-primary" onclick="restartScanner()">
      <i class="bi bi-arrow-repeat me-1"></i>Scan Ulang
    </button>
    <button class="btn btn-outline-secondary" onclick="switchCamera()">
      <i id="camera-icon" class="bi bi-camera-reverse me-1"></i>Ganti Kamera
    </button>
  </div>
</div>

<script>
  let currentCameraId = null;
  let cameras = [];
  let html5QrCode = null;
  let isBackCamera = true;

  async function initCameras() {
    try {
      cameras = await Html5Qrcode.getCameras();
      if (!cameras.length) throw new Error("Tidak ada kamera tersedia.");

      // Cari kamera belakang terlebih dahulu
      const back = cameras.find(cam => cam.label.toLowerCase().includes("back") || cam.label.toLowerCase().includes("rear"));
      currentCameraId = back ? back.id : cameras[0].id;

      startScanner(currentCameraId);
    } catch (e) {
      alert("Gagal mengakses kamera: " + e.message);
    }
  }

  function startScanner(cameraId) {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        runScanner(cameraId);
      });
    } else {
      runScanner(cameraId);
    }
  }

  function runScanner(cameraId) {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      cameraId,
      { fps: 10, qrbox: 250 },
      onScanSuccess,
      onScanFailure
    ).catch(err => console.error("Start failed:", err));
  }

  function onScanSuccess(decodedText, decodedResult) {
    document.getElementById("result-text").textContent = decodedText;
    document.getElementById("scan-result").classList.remove("d-none");
    html5QrCode.stop().then(() => html5QrCode.clear());
  }

  function onScanFailure(error) {
    // optional: do nothing
  }

  function restartScanner() {
    document.getElementById("scan-result").classList.add("d-none");
    startScanner(currentCameraId);
  }

  function switchCamera() {
    if (cameras.length < 2) return alert("Hanya satu kamera tersedia.");

    isBackCamera = !isBackCamera;
    const nextCam = cameras.find(cam =>
      (isBackCamera && cam.label.toLowerCase().includes("back")) ||
      (!isBackCamera && cam.label.toLowerCase().includes("front"))
    );

    currentCameraId = nextCam ? nextCam.id : (isBackCamera ? cameras[0].id : cameras[1].id);
    document.getElementById("camera-icon").className = isBackCamera ? "bi bi-camera-reverse me-1" : "bi bi-camera me-1";
    restartScanner();
  }

  // Mulai otomatis
  initCameras();
</script>

</body>
</html>
