<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Konversi Gambar Batch</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #drop-area {
      border: 2px dashed #999;
      padding: 30px;
      text-align: center;
      color: #666;
      background: #f9f9f9;
      cursor: pointer;
    }
    #drop-area.highlight {
      border-color: #333;
      background: #e0f7fa;
    }
    img.preview {
      max-width: 150px;
      margin: 10px;
    }
  </style>
</head>
<body>

  <h2>🗂️ Konversi Gambar: Drag & Drop + Batch</h2>

  <div id="drop-area">
    Drop file gambar di sini atau klik untuk pilih
    <input type="file" id="fileElem" multiple accept="image/*" style="display:none;">
  </div>

  <br>
  <label>Format Tujuan:</label>
  <select id="format">
    <option value="image/jpeg">JPEG</option>
    <option value="image/png">PNG</option>
    <option value="image/webp">WebP</option>
  </select>
  <button onclick="convertAll()">Convert Semua & Download</button>

  <div id="preview-area"></div>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const dropArea = document.getElementById("drop-area");
    const fileElem = document.getElementById("fileElem");
    const previewArea = document.getElementById("preview-area");
    let images = [];

    // Drag and drop events
    ['dragenter', 'dragover'].forEach(eventName => {
      dropArea.addEventListener(eventName, e => {
        e.preventDefault();
        dropArea.classList.add('highlight');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, e => {
        e.preventDefault();
        dropArea.classList.remove('highlight');
      });
    });

    dropArea.addEventListener('click', () => fileElem.click());

    dropArea.addEventListener('drop', e => {
      const files = [...e.dataTransfer.files];
      handleFiles(files);
    });

    fileElem.addEventListener('change', () => {
      handleFiles([...fileElem.files]);
    });

    function handleFiles(files) {
      previewArea.innerHTML = '';
      images = [];

      files.forEach(file => {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.src = event.target.result;
          img.classList.add('preview');

          img.onload = function () {
            images.push({ name: file.name, image: img });
          };

          previewArea.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    function convertAll() {
      const format = document.getElementById("format").value;
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      images.forEach(({ name, image }) => {
        canvas.width = image.width;
        canvas.height = image.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0);

        const dataURL = canvas.toDataURL(format);
        const link = document.createElement('a');
        link.download = `${name.split('.').slice(0, -1).join('.')}_converted.${format.split('/')[1]}`;
        link.href = dataURL;
        link.click();
      });
    }
  </script>

</body>
</html>
