<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Konversi Gambar Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    #drop-area {
      border: 2px dashed #6c757d;
      padding: 40px;
      text-align: center;
      background-color: #ffffff;
      border-radius: 10px;
      transition: 0.3s;
    }
    #drop-area.highlight {
      border-color: #0d6efd;
      background-color: #e7f1ff;
    }
    img.preview {
      max-width: 150px;
      margin: 10px;
      border-radius: 5px;
      border: 1px solid #dee2e6;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <h2 class="mb-4 text-center">🖼️ Konversi Gambar Drag & Drop</h2>

  <div id="drop-area" class="mb-4">
    <p class="mb-2">Drop file gambar di sini atau klik untuk memilih</p>
    <input type="file" id="fileElem" multiple accept="image/*" class="form-control" style="display:none;">
    <button class="btn btn-outline-primary" onclick="fileElem.click()">Pilih Gambar</button>
  </div>

  <div class="row align-items-center mb-4">
    <div class="col-md-4">
      <label for="format" class="form-label">Format Tujuan:</label>
      <select id="format" class="form-select">
        <option value="image/jpeg">JPEG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>
    <div class="col-md-4 mt-3 mt-md-0">
      <button onclick="convertAll()" class="btn btn-success w-100">Convert & Download</button>
    </div>
  </div>

  <div id="preview-area" class="d-flex flex-wrap justify-content-start"></div>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
  const dropArea = document.getElementById("drop-area");
  const fileElem = document.getElementById("fileElem");
  const previewArea = document.getElementById("preview-area");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let images = [];

  ["dragenter", "dragover"].forEach(eventName => {
    dropArea.addEventListener(eventName, e => {
      e.preventDefault();
      dropArea.classList.add("highlight");
    });
  });

  ["dragleave", "drop"].forEach(eventName => {
    dropArea.addEventListener(eventName, e => {
      e.preventDefault();
      dropArea.classList.remove("highlight");
    });
  });

  dropArea.addEventListener("click", () => fileElem.click());
  dropArea.addEventListener("drop", e => {
    const files = [...e.dataTransfer.files];
    handleFiles(files);
  });
  fileElem.addEventListener("change", () => {
    handleFiles([...fileElem.files]);
  });

  function handleFiles(files) {
    previewArea.innerHTML = "";
    images = [];

    files.forEach(file => {
      if (!file.type.startsWith("image/") || file.type === "image/svg+xml") return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          images.push({ name: file.name, image: img });
          const preview = img.cloneNode();
          preview.classList.add("preview");
          previewArea.appendChild(preview);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function convertAll() {
    const format = document.getElementById("format").value;

    images.forEach(({ name, image }) => {
      const tempImg = new Image();
      tempImg.crossOrigin = "anonymous";
      tempImg.onload = () => {
        canvas.width = tempImg.width;
        canvas.height = tempImg.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempImg, 0, 0);

        try {
          const dataURL = canvas.toDataURL(format);
          const link = document.createElement("a");
          link.download = `${name.split(".").slice(0, -1).join(".")}_converted.${format.split("/")[1]}`;
          link.href = dataURL;
          link.click();
        } catch (err) {
          alert(`Gagal konversi gambar: ${name}\n${err.message}`);
        }
      };
      tempImg.src = image.src;
    });
  }
</script>

</body>
</html>
