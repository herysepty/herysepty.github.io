<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pug to HTML Preview</title>

  <!-- Pug browser version -->
  <script src="https://cdn.jsdelivr.net/npm/pug@3.0.2/pug.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 200px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    pre {
      background: #f0f0f0;
      padding: 10px;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      margin-top: 10px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Pug to HTML Live Preview</h2>

  <label for="pugInput">Paste your PUG code below:</label>
  <textarea id="pugInput" placeholder="html\n  head\n    title Judul\n  body\n    h1 Hello Pug!"></textarea>
  <br>
  <button id="convertBtn">Convert & Preview</button>

  <h3>Generated HTML:</h3>
  <pre id="htmlOutput"></pre>

  <h3>Live Preview:</h3>
  <iframe id="preview"></iframe>

  <script>
    document.getElementById('convertBtn').addEventListener('click', function () {
      const pugCode = document.getElementById('pugInput').value;
      try {
        const html = window.pug.render(pugCode);
        document.getElementById('htmlOutput').textContent = html;
        document.getElementById('preview').srcdoc = html;
      } catch (err) {
        document.getElementById('htmlOutput').textContent = '❌ Error: ' + err.message;
        document.getElementById('preview').srcdoc = '';
      }
    });
  </script>
</body>
</html>
