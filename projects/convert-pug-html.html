<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pug to HTML Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/pug@3.0.2/pug.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Convert PUG to HTML & Preview</h2>
  <input type="file" id="pugFile" accept=".pug" />
  <pre id="htmlOutput"></pre>
  <iframe id="preview"></iframe>

  <script>
    document.getElementById('pugFile').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const pugCode = e.target.result;
        try {
          const compiledHTML = pug.render(pugCode);
          document.getElementById('htmlOutput').textContent = compiledHTML;
          document.getElementById('preview').srcdoc = compiledHTML;
        } catch (err) {
          alert("Error compiling PUG: " + err.message);
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
