<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>WebRTC P2P via Firebase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    video { width:100%; border-radius:12px; background:#000; }
  </style>
</head>
<body class="container py-4">
  <h2 class="text-center mb-4">🎥 WebRTC P2P (Firebase Signaling)</h2>

  <div class="row g-3 mb-3">
    <div class="col d-grid">
      <button id="startBtn" class="btn btn-primary">Start Camera</button>
    </div>
    <div class="col d-grid">
      <button id="createBtn" class="btn btn-success">Create Room</button>
    </div>
    <div class="col d-grid">
      <button id="joinBtn" class="btn btn-warning">Join Room</button>
    </div>
    <div class="col d-grid">
      <button id="hangupBtn" class="btn btn-danger">Hangup</button>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <h5 class="text-center">Local Video</h5>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="col-md-6">
      <h5 class="text-center">Remote Video</h5>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Room ID</label>
    <input id="roomId" class="form-control" placeholder="Isi / copy Room ID">
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "xxx",
  authDomain: "xxx",
  databaseURL: "xxx.asia-southeast1.firebasedatabase.app",
  projectId: "xxx",
  storageBucket: "xxx.firebasestorage.app",
  messagingSenderId: "xxx",
  appId: "xxx",
  measurementId: "xxx"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let pc, localStream, remoteStream;
const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];

const startBtn = document.getElementById("startBtn");
const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");
const hangupBtn = document.getElementById("hangupBtn");
const roomInput = document.getElementById("roomId");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

async function initMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  localVideo.srcObject = localStream;
}

function createPeer() {
  pc = new RTCPeerConnection({ iceServers });
  remoteStream = new MediaStream();
  remoteVideo.srcObject = remoteStream;

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

  pc.onicecandidate = e => {
    if (e.candidate) {
      const roomId = roomInput.value;
      db.ref("rooms/" + roomId + "/candidates").push(JSON.stringify(e.candidate));
    }
  };
}

createBtn.onclick = async () => {
  await initMedia();
  createPeer();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const roomRef = db.ref("rooms").push();
  roomInput.value = roomRef.key;
  await roomRef.set({ offer: JSON.stringify(offer) });

  roomRef.child("answer").on("value", async snap => {
    if (snap.val() && !pc.currentRemoteDescription) {
      const answer = JSON.parse(snap.val());
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
    }
  });

  db.ref("rooms/" + roomRef.key + "/candidates").on("child_added", async snap => {
    const candidate = JSON.parse(snap.val());
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) { }
  });
};

joinBtn.onclick = async () => {
  await initMedia();
  createPeer();

  const roomId = roomInput.value;
  const roomRef = db.ref("rooms/" + roomId);
  const roomData = (await roomRef.get()).val();

  if (!roomData) { alert("Room tidak ada"); return; }

  const offer = JSON.parse(roomData.offer);
  await pc.setRemoteDescription(new RTCSessionDescription(offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await roomRef.child("answer").set(JSON.stringify(answer));

  roomRef.child("candidates").on("child_added", async snap => {
    const candidate = JSON.parse(snap.val());
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) { }
  });
};

hangupBtn.onclick = () => {
  if (pc) { pc.close(); pc = null; }
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
};
</script>
</body>
</html>
