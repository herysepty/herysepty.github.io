<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebRTC P2P Demo</title>
  <style>
    video { width: 45%; background:#000; border-radius:12px; margin:5px; }
    textarea { width: 90%; height:100px; }
  </style>
</head>
<body>
  <h2>WebRTC P2P (No Server)</h2>
  <button id="start">Start Camera</button>
  <button id="createOffer">Create Offer</button>
  <button id="createAnswer">Create Answer</button>
  <button id="setAnswer">Set Remote Answer</button>
  <br><br>

  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>
  <br>

  <h3>Local Description</h3>
  <textarea id="localSDP"></textarea>
  <h3>Remote Description</h3>
  <textarea id="remoteSDP"></textarea>

<script>
let pc, localStream;

const iceServers = [
  { urls: 'stun:stun.l.google.com:19302' }
];

async function initPeer() {
  pc = new RTCPeerConnection({ iceServers });

  pc.onicecandidate = (e) => {
    if (e.candidate) return;
    // SDP siap (offer/answer)
    document.getElementById("localSDP").value =
      JSON.stringify(pc.localDescription);
  };

  pc.ontrack = (e) => {
    document.getElementById("remoteVideo").srcObject = e.streams[0];
  };

  if (!localStream) {
    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    document.getElementById("localVideo").srcObject = localStream;
  }

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

document.getElementById("start").onclick = async () => {
  await initPeer();
};

document.getElementById("createOffer").onclick = async () => {
  if (!pc) await initPeer();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
};

document.getElementById("createAnswer").onclick = async () => {
  if (!pc) await initPeer();
  const remote = JSON.parse(document.getElementById("remoteSDP").value);
  await pc.setRemoteDescription(new RTCSessionDescription(remote));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
};

document.getElementById("setAnswer").onclick = async () => {
  const remote = JSON.parse(document.getElementById("remoteSDP").value);
  await pc.setRemoteDescription(new RTCSessionDescription(remote));
};
</script>
</body>
</html>
