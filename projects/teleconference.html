<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2P Video Call</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    video { width: 100%; border-radius: 12px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="container py-4">
  <h2 class="mb-3">📹 P2P Video Call</h2>

  <div class="mb-3">
    <input id="roomInput" class="form-control" placeholder="Room ID (5 karakter)">
  </div>
  <div class="mb-3">
    <button id="createBtn" class="btn btn-primary">Create Room</button>
    <button id="joinBtn" class="btn btn-success">Join Room</button>
    <button id="hangupBtn" class="btn btn-danger d-none">Hang Up</button>
  </div>

  <div class="row">
    <div class="col-md-6">
      <h5>Local</h5>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="col-md-6">
      <h5>Remote</h5>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script>
    // === Ambil config dari query URL ===
    const params = new URLSearchParams(window.location.search);
    const firebaseConfig = {
      apiKey: params.get("apiKey"),
      databaseURL: params.get("databaseURL"),
    };

    if (!firebaseConfig.apiKey || !firebaseConfig.databaseURL) {
      alert("Tambahkan ?apiKey=xxx&databaseURL=xxx di URL");
    } else {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }

    let pc, localStream;
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const roomInput = document.getElementById("roomInput");
    const createBtn = document.getElementById("createBtn");
    const joinBtn = document.getElementById("joinBtn");
    const hangupBtn = document.getElementById("hangupBtn");

    // Generate Room ID (5 karakter)
    function generateRoomId() {
      return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    // Setup PeerConnection
    function setupPeerConnection() {
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" }
        ]
      });

      pc.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
      };

      pc.oniceconnectionstatechange = () => {
        console.log("ICE state:", pc.iceConnectionState);

        if (["connected", "completed"].includes(pc.iceConnectionState)) {
          hangupBtn.classList.remove("d-none");
        }

        if (["disconnected", "failed", "closed"].includes(pc.iceConnectionState)) {
          hangupBtn.classList.add("d-none");
          endCall();
        }
      };

      return pc;
    }

    // End call
    function endCall() {
      if (pc) { pc.close(); pc = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
    }

    // Listen kalau room dihapus
    function listenRoomEnd(roomId) {
      const roomRef = db.ref("rooms/" + roomId);
      roomRef.on("value", snap => {
        if (!snap.exists()) {
          console.log("Room deleted by peer, ending call...");
          hangupBtn.classList.add("d-none");
          endCall();
        }
      });
    }

    // Create Room
    createBtn.onclick = async () => {
      const roomId = generateRoomId();
      roomInput.value = roomId;

      pc = setupPeerConnection();
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await db.ref("rooms/" + roomId).set({ offer });
      listenRoomEnd(roomId);

      db.ref("rooms/" + roomId + "/answer").on("value", async snap => {
        if (snap.val() && !pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
        }
      });

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          db.ref("rooms/" + roomId + "/callerCandidates").push(event.candidate.toJSON());
        }
      };

      db.ref("rooms/" + roomId + "/calleeCandidates").on("child_added", async snap => {
        await pc.addIceCandidate(new RTCIceCandidate(snap.val()));
      });
    };

    // Join Room
    joinBtn.onclick = async () => {
      const roomId = roomInput.value.trim();
      if (!roomId) return alert("Masukkan Room ID");

      pc = setupPeerConnection();
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const roomRef = db.ref("rooms/" + roomId);
      const roomSnap = await roomRef.once("value");
      if (!roomSnap.exists()) return alert("Room tidak ditemukan");

      const offer = roomSnap.val().offer;
      await pc.setRemoteDescription(new RTCSessionDescription(offer));

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await roomRef.child("answer").set(answer);
      listenRoomEnd(roomId);

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          roomRef.child("calleeCandidates").push(event.candidate.toJSON());
        }
      };

      roomRef.child("callerCandidates").on("child_added", async snap => {
        await pc.addIceCandidate(new RTCIceCandidate(snap.val()));
      });
    };

    // Hangup
    hangupBtn.onclick = async () => {
      const roomId = roomInput.value.trim();
      if (roomId) {
        await db.ref("rooms/" + roomId).remove();
        console.log("Room deleted:", roomId);
      }
      hangupBtn.classList.add("d-none");
      endCall();
    };
  </script>
</body>
</html>
