<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>WebRTC P2P Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    video { width: 100%; border-radius: 12px; background: #000; }
    textarea { font-family: monospace; }
  </style>
</head>
<body class="container py-4">
  <h2 class="mb-4 text-center">🎥 WebRTC P2P (No Server)</h2>

  <div class="row g-3 mb-3">
    <div class="col d-grid">
      <button id="start" class="btn btn-primary">Start Camera</button>
    </div>
    <div class="col d-grid">
      <button id="createOffer" class="btn btn-success">Create Offer</button>
    </div>
    <div class="col d-grid">
      <button id="createAnswer" class="btn btn-warning">Create Answer</button>
    </div>
    <div class="col d-grid">
      <button id="setAnswer" class="btn btn-danger">Set Remote Answer</button>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <h5 class="text-center">Local Video</h5>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="col-md-6">
      <h5 class="text-center">Remote Video</h5>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Local Description (copy & send ke peer)</label>
      <textarea id="localSDP" class="form-control" rows="6"></textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Remote Description (paste dari peer)</label>
      <textarea id="remoteSDP" class="form-control" rows="6"></textarea>
    </div>
  </div>

  <!-- Bootstrap JS (opsional, hanya untuk komponen interaktif) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let pc, localStream;
const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];

async function initPeer() {
  pc = new RTCPeerConnection({ iceServers });

  pc.onicecandidate = (e) => {
    if (e.candidate) return;
    document.getElementById("localSDP").value =
      JSON.stringify(pc.localDescription);
  };

  pc.ontrack = (e) => {
    document.getElementById("remoteVideo").srcObject = e.streams[0];
  };

  if (!localStream) {
    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    document.getElementById("localVideo").srcObject = localStream;
  }

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

document.getElementById("start").onclick = async () => {
  await initPeer();
};

document.getElementById("createOffer").onclick = async () => {
  if (!pc) await initPeer();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
};

document.getElementById("createAnswer").onclick = async () => {
  if (!pc) await initPeer();
  const remote = JSON.parse(document.getElementById("remoteSDP").value);
  await pc.setRemoteDescription(new RTCSessionDescription(remote));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
};

document.getElementById("setAnswer").onclick = async () => {
  const remote = JSON.parse(document.getElementById("remoteSDP").value);
  await pc.setRemoteDescription(new RTCSessionDescription(remote));
};
</script>
</body>
</html>
